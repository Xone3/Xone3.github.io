<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 09</title>
  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      padding: 20px;
    }

    h1 {
      font-size: 28px;
      margin: 18px 0;
      padding: 6px 8px;
    }

    .box1 {
      background-color: lightblue;
      border: 8px double tomato;
    }

    .box2 {
      background-color: yellow;
      border: 2px solid dodgerblue;
      border-radius: 12px;
    }

    .box3 {
      background-color: mediumseagreen;
      border: 8px dotted gray;
    }
  </style>
</head>
<body>

  <h1 class="box1">Hello World</h1>
  <h1 class="box2">Hello World</h1>
  <h1 class="box3">Hello World</h1>

</body>
</html>
